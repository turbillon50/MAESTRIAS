<style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center overflow-hidden">

                REDIBAI ORIZABA
            </h1>

                Excelencia educativa conectada

</div>
<!-- Entrance CTA -->
<div class="mt-section-gap flex flex-col gap-4 items-center">

<span class="relative z-10">INGRESAR AL CAMPUS</span>

</button>

</div>

<div class="w-1 h-1 bg-secondary rounded-full animate-pulse [animation-delay:400ms]"></div>

<!-- Micro-interaction Script -->
<script>
        function enterCampus() {
            // Simple visual transition effect
            const main = document.querySelector('main');
            main.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            main.style.opacity = '0';
            main.style.transform = 'scale(1.05)';
            
            setTimeout(() => {
                alert('Iniciando sesión en REDIBAI ORIZABA...');
                main.style.opacity = '1';
                main.style.transform = 'scale(1)';
            }, 1000);
        }

        // Parallax effect for the logo on mouse move
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('img');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            logo.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
