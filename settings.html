<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>REDIBAI — Ajustes</title>
<meta name="theme-color" content="#111415" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/app.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body>
<div id="app"></div>
<script src="/data.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
(function () {
  const D = REDIBAI;
  const session = RedibaiApp.getSession();

  const html = `
    <div class="grid" style="grid-template-columns: 280px 1fr; gap:24px">
      <aside class="card" style="height:fit-content;padding:8px">
        <button class="nav-item is-active" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">person</span><span>Perfil</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">palette</span><span>Apariencia</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">notifications</span><span>Notificaciones</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">security</span><span>Seguridad</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">install_mobile</span><span>App e instalación</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">group</span><span>Permisos y roles</span></button>
        <button class="nav-item" style="width:100%;border:0;background:transparent">  <span class="material-symbols-outlined">cloud_sync</span><span>Integraciones</span></button>
      </aside>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-title"><h2>Perfil institucional</h2><span class="chip chip-gold">${session.user.role}</span></div>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
            ${RedibaiApp.avatar(session.user.name, 42, 64)}
            <div>
              <div style="font-size:16px;font-weight:600">${session.user.name}</div>
              <div class="muted" style="font-size:12px">${session.user.email}</div>
            </div>
            <button class="btn btn-ghost btn-sm" style="margin-left:auto"><span class="material-symbols-outlined">photo_camera</span>Cambiar foto</button>
          </div>

          <div class="grid grid-2">
            <div class="field"><label>Nombre completo</label><input value="${session.user.name}"/></div>
            <div class="field"><label>Correo institucional</label><input value="${session.user.email}"/></div>
            <div class="field"><label>Cargo</label><input value="${session.user.role}"/></div>
            <div class="field"><label>Sede principal</label>
              <select>${D.LOCATIONS.map(l => `<option ${l.id===session.user.locationId?'selected':''}>${l.name}</option>`).join('')}</select>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
            <button class="btn btn-ghost">Cancelar</button>
            <button class="btn btn-gold" onclick="RedibaiApp.toast({title:'Perfil actualizado',body:'Los cambios se guardaron correctamente.',icon:'check_circle',kind:'success'})">Guardar cambios</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><h2>Preferencias de notificación</h2><span class="material-symbols-outlined">notifications</span></div>
          ${[
            ['Alertas académicas',     'Riesgo de bajas, alertas de asistencia, calificaciones críticas',true],
            ['Mensajes y conversaciones','Notificarme cuando alguien me escribe',true],
            ['Eventos del calendario',  'Recordatorios 30 min antes',true],
            ['Sincronización con SEP',  'Confirmaciones de envío automático',false],
            ['Resumen semanal',         'Email cada lunes con KPIs principales',true]
          ].map(([t,d,on]) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
              <div><div style="font-weight:500">${t}</div><div class="muted" style="font-size:12px">${d}</div></div>
              <label class="switch"><input type="checkbox" ${on?'checked':''}/><span></span></label>
            </div>`).join('')}
        </div>

        <div class="card">
          <div class="card-title"><h2>Aplicación REDIBAI</h2><span class="material-symbols-outlined">install_mobile</span></div>
          <div class="muted" style="font-size:13px;margin-bottom:14px">Esta es una <b>Progressive Web App</b>: puedes instalarla en cualquier dispositivo y usarla sin conexión.</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-gold" id="install-cta-page"><span class="material-symbols-outlined">download</span>Instalar en este dispositivo</button>
            <button class="btn btn-ghost" onclick="(async () => { if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); regs.forEach(r=>r.update()); RedibaiApp.toast({title:'Buscando actualizaciones',body:'Verificando nueva versión del campus…',icon:'refresh'}); }})()"><span class="material-symbols-outlined">refresh</span>Buscar actualizaciones</button>
            <button class="btn btn-ghost" onclick="if(confirm('¿Vaciar caché offline?')){ caches.keys().then(k=>k.forEach(c=>caches.delete(c))); RedibaiApp.toast({title:'Caché vaciado',body:'Se recargarán los recursos en el próximo uso.',icon:'cleaning_services',kind:'success'}); }"><span class="material-symbols-outlined">cleaning_services</span>Vaciar caché</button>
          </div>
          <div class="divider"></div>
          <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--outline)">
            <span><b>Versión:</b> 2.0.0 demo</span>
            <span><b>Build:</b> realtime-academy</span>
            <span><b>Service worker:</b> <span id="sw-state">checking…</span></span>
            <span><b>Conexión:</b> <span id="pwa-status-2">—</span></span>
          </div>
        </div>

        <div class="card" style="border-color:rgba(255,180,171,.2)">
          <div class="card-title"><h2 style="color:var(--error)">Zona crítica</h2><span class="material-symbols-outlined" style="color:var(--error)">warning</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
            <div><div style="font-weight:500">Cerrar sesión en todos los dispositivos</div><div class="muted" style="font-size:12px">Cierra todas las sesiones activas inmediatamente.</div></div>
            <a href="/login.html" class="btn btn-ghost" onclick="localStorage.removeItem('redibai:session')">Cerrar sesión</a>
          </div>
        </div>
      </div>
    </div>

    <style>
      .switch { position:relative; display:inline-block; width:38px; height:22px; }
      .switch input { opacity:0; width:0; height:0; }
      .switch span { position:absolute; inset:0; background:rgba(255,255,255,.1); border-radius:9999px; cursor:pointer; transition:.2s; }
      .switch span::before { content:''; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#e1e3e4; border-radius:50%; transition:.2s; }
      .switch input:checked + span { background:var(--gold); }
      .switch input:checked + span::before { transform:translateX(16px); background:var(--on-gold); }
    </style>
  `;

  RedibaiApp.mount({ active:'settings', title:'Ajustes', subtitle:'Configuración personal e institucional', html });

  // SW state
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      document.getElementById('sw-state').textContent = reg ? 'registrado · activo' : 'no registrado';
    });
  } else {
    document.getElementById('sw-state').textContent = 'no soportado';
  }
  const status2 = document.getElementById('pwa-status-2');
  const setS = () => status2.textContent = navigator.onLine ? 'En línea' : 'Sin conexión';
  setS();
  window.addEventListener('online', setS);
  window.addEventListener('offline', setS);

  document.getElementById('install-cta-page').addEventListener('click', () => {
    const btn = document.getElementById('pwa-install-btn');
    if (btn && !btn.hidden) { btn.click(); }
    else { RedibaiApp.toast({title:'Instalación', body:'Usa el menú de tu navegador → "Instalar app" o "Añadir a pantalla de inicio".', icon:'install_mobile'}); }
  });
})();
</script>
<script src="/realtime.js"></script>
<script src="/pwa.js" defer></script>
</body>
</html>
