<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>REDIBAI Orizaba — Excelencia Educativa</title>
<meta name="description" content="REDIBAI Orizaba — Campus digital y ecosistema académico de excelencia." />
<meta name="theme-color" content="#111415" />
<meta name="color-scheme" content="dark" />
<meta name="application-name" content="REDIBAI" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="REDIBAI" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "secondary-fixed": "#ffe088", "inverse-primary": "#515f78", "on-tertiary-fixed": "#111c2c",
          "surface-container-highest": "#323536", "outline": "#8f9097", "tertiary-fixed-dim": "#bcc7dc",
          "surface-container": "#1d2021", "on-secondary-fixed": "#241a00", "surface-dim": "#111415",
          "error-container": "#93000a", "outline-variant": "#44474d", "primary-fixed-dim": "#b9c7e4",
          "background": "#111415", "surface-container-lowest": "#0c0f10", "on-tertiary-container": "#778296",
          "tertiary-container": "#0e1929", "on-secondary-container": "#342800", "secondary-fixed-dim": "#e9c349",
          "surface-bright": "#373a3b", "on-error-container": "#ffdad6", "surface-container-low": "#191c1d",
          "on-surface": "#e1e3e4", "on-tertiary": "#263141", "error": "#ffb4ab", "primary-container": "#0a192f",
          "on-primary": "#233148", "on-surface-variant": "#c5c6cd", "inverse-surface": "#e1e3e4",
          "tertiary": "#bcc7dc", "on-primary-fixed-variant": "#39475f", "tertiary-fixed": "#d7e3f9",
          "on-primary-container": "#74829d", "surface-container-high": "#282a2b", "on-background": "#e1e3e4",
          "primary": "#b9c7e4", "on-primary-fixed": "#0d1c32", "inverse-on-surface": "#2e3132",
          "secondary-container": "#af8d11", "secondary": "#e9c349", "on-error": "#690005",
          "on-tertiary-fixed-variant": "#3c4759", "on-secondary-fixed-variant": "#574500",
          "surface-variant": "#323536", "on-secondary": "#3c2f00", "primary-fixed": "#d6e3ff",
          "surface": "#111415", "surface-tint": "#b9c7e4"
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: {
          base: "8px", gutter: "24px", "container-padding-mobile": "20px",
          "section-gap": "80px", "container-padding-desktop": "40px", "card-gap": "24px"
        },
        fontFamily: {
          "label-caps": ["Inter"], "headline-md": ["Libre Caslon Text"], "headline-sm": ["Libre Caslon Text"],
          "display-lg": ["Libre Caslon Text"], "display-lg-mobile": ["Libre Caslon Text"],
          "body-md": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"]
        },
        fontSize: {
          "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" }],
          "headline-md": ["32px", { lineHeight: "1.3", fontWeight: "600" }],
          "headline-sm": ["24px", { lineHeight: "1.4", fontWeight: "600" }],
          "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
          "display-lg-mobile": ["36px", { lineHeight: "1.2", fontWeight: "700" }],
          "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
          "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
          "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }]
        }
      }
    }
  };
</script>
<style>
  @keyframes shimmer {
    0% { opacity: 0.4; filter: brightness(1); }
    50% { opacity: 1; filter: brightness(1.3); }
    100% { opacity: 0.4; filter: brightness(1); }
  }
  .animate-shimmer { animation: shimmer 4s ease-in-out infinite; }
  .gold-glow {
    background: radial-gradient(circle, rgba(233, 195, 73, 0.15) 0%, rgba(17, 20, 21, 0) 70%);
  }
  .glass-panel {
    background: rgba(29, 32, 33, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
  body { min-height: max(884px, 100dvh); }
  /* PWA install pill */
  #pwa-install-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 60;
    background: rgba(29,32,33,.85); backdrop-filter: blur(20px);
    border: 1px solid rgba(233,195,73,.35); color: #ffe088;
    border-radius: 9999px; padding: 10px 18px;
    font-family: Inter, sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  #pwa-install-btn[hidden] { display: none; }
  #pwa-install-btn:hover { border-color: #e9c349; color: #e9c349; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center overflow-hidden">
<div class="fixed inset-0 z-0">
  <div class="absolute inset-0 flex items-center justify-center opacity-40">
    <div class="w-[800px] h-[800px] gold-glow rounded-full"></div>
  </div>
  <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-surface-container-lowest opacity-80"></div>
</div>

<main class="relative z-10 flex flex-col items-center justify-center w-full max-w-4xl px-container-padding-mobile text-center">
  <div class="mb-12 relative group">
    <div class="absolute -inset-10 bg-secondary/10 blur-3xl rounded-full opacity-50 group-hover:opacity-80 transition-opacity duration-700"></div>
    <div class="h-40 md:h-56 w-40 md:w-56 mx-auto animate-shimmer filter drop-shadow-[0_0_15px_rgba(233,195,73,0.3)] flex items-center justify-center">
      <span class="material-symbols-outlined text-secondary" style="font-size: 9rem; font-variation-settings: 'FILL' 1;">school</span>
    </div>
  </div>

  <div class="space-y-6">
    <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-secondary tracking-tighter">REDIBAI ORIZABA</h1>
    <div class="w-16 h-[1px] bg-secondary-fixed/30 mx-auto"></div>
    <p class="font-headline-sm text-headline-sm text-on-surface-variant font-light italic max-w-lg mx-auto opacity-80">
      Excelencia educativa conectada
    </p>
  </div>

  <div class="mt-section-gap flex flex-col gap-4 items-center">
    <a href="/admin.html" class="group relative px-10 py-4 bg-secondary text-on-secondary rounded-full font-label-caps text-label-caps transition-all duration-500 hover:scale-105 active:scale-95 overflow-hidden">
      <span class="relative z-10">INGRESAR AL CAMPUS</span>
      <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
    </a>
    <div class="flex items-center gap-6 mt-8">
      <a class="font-label-caps text-[10px] text-outline hover:text-secondary transition-colors tracking-[0.2em] uppercase" href="/welcome.html">Bienvenida</a>
      <span class="w-1 h-1 bg-outline/30 rounded-full"></span>
      <a class="font-label-caps text-[10px] text-outline hover:text-secondary transition-colors tracking-[0.2em] uppercase" href="/login.html">Iniciar sesión</a>
      <span class="w-1 h-1 bg-outline/30 rounded-full"></span>
      <a class="font-label-caps text-[10px] text-outline hover:text-secondary transition-colors tracking-[0.2em] uppercase" href="/dashboard.html">Vista alumno</a>
    </div>
    <p class="mt-6 font-label-caps text-[10px] text-outline/60 tracking-[0.2em] uppercase">400 alumnos · 5 maestrías · 3 doctorados · 7 sedes</p>
    <span id="pwa-status" data-state="online" class="mt-2 font-label-caps text-[10px] text-outline/60 tracking-widest uppercase"></span>
  </div>
</main>

<div class="fixed bottom-12 left-1/2 -translate-x-1/2 flex gap-3 opacity-20 pointer-events-none">
  <div class="w-1 h-1 bg-secondary rounded-full animate-pulse"></div>
  <div class="w-1 h-1 bg-secondary rounded-full animate-pulse [animation-delay:200ms]"></div>
  <div class="w-1 h-1 bg-secondary rounded-full animate-pulse [animation-delay:400ms]"></div>
</div>

<button id="pwa-install-btn" hidden type="button" aria-label="Instalar la aplicación REDIBAI">
  <span class="material-symbols-outlined" style="font-size:18px;">download</span>
  Instalar app
</button>

<script>
  document.addEventListener('mousemove', (e) => {
    const logo = document.querySelector('main > div:first-child > div:last-child');
    if (!logo) return;
    const x = (window.innerWidth / 2 - e.pageX) / 50;
    const y = (window.innerHeight / 2 - e.pageY) / 50;
    logo.style.transform = `translate(${x}px, ${y}px)`;
  });
</script>
<script src="/pwa.js" defer></script>
</body>
</html>
